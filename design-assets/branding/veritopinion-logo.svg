<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 160" width="780" height="160" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .brand-txt {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 58px;
        font-weight: 700;
        fill: #0063ec;
        letter-spacing: -0.5px;
      }
      .est-txt {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 21px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: 2.8px;
      }
    </style>
    <linearGradient id="badgeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066f0" />
      <stop offset="100%" stop-color="#005fe6" />
    </linearGradient>
  </defs>

  <!-- 1. 3D Tilted Blue Badge Icon with Dark Navy 'V' -->
  <g transform="translate(14, 24)">
    <!-- Perspective Polygon Card -->
    <path d="M 0,25 
             C 0,17 5,13 11,12 
             L 78,1 
             C 85,0 91,4 91,11 
             L 91,100 
             C 91,107 85,111 78,110 
             L 11,98 
             C 5,97 0,93 0,86 
             Z" 
          fill="url(#badgeBlue)" />
    <!-- Dark Navy 'V' with 3D slant matching card -->
    <path d="M 15,38 
             L 44,88 
             C 45.5,90.5 48.5,90.5 50,88 
             L 79,25" 
          stroke="#09172f" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>

  <!-- 2. 'Verit' Text -->
  <text x="122" y="105" class="brand-txt">Verit</text>

  <!-- 3. Stylized Interlocking 'op' Motif -->
  <g transform="translate(282, 45)">
    <!-- Orange 'o' circle with gap at right for the 'p' stem -->
    <path d="M 38,16 A 24.5,24.5 0 1,0 38,58" stroke="#fc0502" stroke-width="9.5" stroke-linecap="round" fill="none" />
    
    <!-- Royal Blue 'p' vertical stem -->
    <line x1="41" y1="14" x2="41" y2="86" stroke="#0063ec" stroke-width="9.5" stroke-linecap="round" />
    
    <!-- Royal Blue 'p' loop -->
    <path d="M 41,17 C 59,17 69,27 69,37 C 69,47 59,57 41,57" stroke="#0063ec" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Front interlocking weave segment of orange 'o' -->
    <path d="M 36,17 C 38,17 39.5,16.5 41,16.5" stroke="#fc0502" stroke-width="9.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- 4. 'inion' Text -->
  <text x="368" y="105" class="brand-txt">inion</text>

  <!-- 5. Dark Navy 'EST. 2017' Pill Badge -->
  <g transform="translate(562, 52)">
    <rect x="0" y="0" width="185" height="56" rx="15" fill="#091932" />
    <text x="92.5" y="35" text-anchor="middle" class="est-txt">EST. 2017</text>
  </g>
</svg>